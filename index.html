<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para Você ✦ Uma Pergunta Escrita nas Estrelas</title>
<link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:ital,wght@0,300;0,400;0,500;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3ecdd;--ink-dim:#cfc4ae;--gold:#f2c76e;--rose:#ff7d9c;--cyan:#7fe0f2;--bg:#05060f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 90% at 28% 18%, #101a38 0%, transparent 55%),
    radial-gradient(100% 80% at 78% 82%, #1a0f24 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;user-select:none;
}
canvas#space{position:fixed;inset:0;z-index:0;display:block}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 120% at 50% 46%, transparent 52%, rgba(2,3,9,.62) 100%);}

.layer{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity 1.3s ease,visibility 1.3s;}
.layer.on{opacity:1;visibility:visible}

.eyebrow{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.5em;
  text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:18px;}
h1,h2,.display{font-family:'Italiana',serif;font-weight:400}
.line{font-family:'Italiana',serif;font-size:clamp(1.45rem,4.6vw,2.7rem);
  line-height:1.45;letter-spacing:.03em;color:var(--ink);
  text-shadow:0 0 26px rgba(242,199,110,.22),0 2px 18px rgba(0,0,0,.6);
  max-width:22ch;margin:0 auto;}
.line em{font-style:normal;color:var(--gold)}

.btn{pointer-events:auto;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;
  font-size:clamp(.78rem,2.4vw,.95rem);letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink);background:linear-gradient(180deg,rgba(242,199,110,.14),rgba(242,199,110,.03));
  border:1px solid rgba(242,199,110,.55);border-radius:999px;padding:1.05em 2.6em;
  position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s,background .45s;
  box-shadow:0 0 0 rgba(242,199,110,0);}
.btn::before{content:"✦";position:absolute;left:1.1em;top:50%;translate:0 -50%;
  color:var(--gold);opacity:0;transition:.4s;font-size:.8em}
.btn::after{content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,246,220,.28) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform 1s ease;}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--gold);
  box-shadow:0 0 34px rgba(242,199,110,.35),inset 0 0 18px rgba(242,199,110,.12);}
.btn:hover::before{opacity:1}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.97)}
.btnwrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:34px;
  opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease;}
.btnwrap.on{opacity:1;transform:none}

#l-intro .halo{position:absolute;width:min(70vmin,560px);height:min(70vmin,560px);
  border-radius:50%;border:1px solid rgba(242,199,110,.14);animation:haloSpin 40s linear infinite;}
#l-intro .halo.h2{width:min(88vmin,720px);height:min(88vmin,720px);
  border-color:rgba(127,224,242,.08);animation-duration:70s;animation-direction:reverse;}
@keyframes haloSpin{to{transform:rotate(360deg)}}
#l-intro .eyebrow{animation:fadeUp 1.6s .3s both}
#introTitle{font-size:clamp(2.1rem,7.4vw,4.6rem);letter-spacing:.1em;line-height:1.1;
  text-shadow:0 0 40px rgba(255,125,156,.28);animation:fadeUp 1.6s .55s both;}
#introTitle span{color:var(--rose)}
#l-intro .btn{margin-top:38px;animation:fadeUp 1.6s .95s both}
#soundHint{margin-top:20px;font-family:'Space Mono',monospace;font-size:.66rem;
  letter-spacing:.34em;color:var(--ink-dim);opacity:.75;animation:fadeUp 1.6s 1.25s both,hintPulse 3s 2s infinite;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:.9}}
#l-intro.off{opacity:0;transition:opacity 1.1s}

#darkveil{position:fixed;inset:0;z-index:3;opacity:0;pointer-events:none;
  transition:opacity 2s ease;
  background:radial-gradient(90% 80% at 50% 45%,rgba(4,6,16,.5),rgba(3,4,11,.94));}
#darkveil.on{opacity:1}

#spark{position:fixed;left:50%;top:46%;z-index:7;width:8px;height:8px;margin:-4px;
  border-radius:50%;background:#fff6e0;opacity:0;pointer-events:none;
  box-shadow:0 0 18px 6px rgba(255,240,205,.9),0 0 60px 24px rgba(242,199,110,.35);
  transition:opacity 1.4s;}
#spark.on{opacity:1;animation:sparkBreath 2.6s ease-in-out infinite}
#spark.big{animation:sparkGrow 2.8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes sparkBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes sparkGrow{0%{transform:scale(.2);filter:blur(2px)}100%{transform:scale(9);filter:blur(0)}}

#l-counter{justify-content:center;gap:0}
#counterIntro{font-family:'Space Mono',monospace;font-size:clamp(.75rem,1.8vw,.95rem);
  letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  margin-bottom:40px;font-weight:700;
  text-shadow:0 0 15px rgba(242,199,110,.6);
  background:rgba(10,15,30,.5);backdrop-filter:blur(8px);
  padding:12px 24px;border-radius:8px;
  border:1px solid rgba(242,199,110,.3);}
#counter{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:clamp(14px,3.4vw,34px)}
.cfield{display:flex;flex-direction:column;align-items:center;gap:12px;
  background:rgba(10,15,30,.6);backdrop-filter:blur(10px);
  padding:24px 20px;border-radius:16px;
  border:1px solid rgba(242,199,110,.3);
  min-width:clamp(90px,14vw,140px);
  transition:all .3s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.4);}
.cfield:hover{border-color:rgba(242,199,110,.6);transform:translateY(-3px);
  box-shadow:0 6px 30px rgba(242,199,110,.2);}
.cnum{font-family:'Italiana',serif;font-size:clamp(2.5rem,6vw,4rem);
  color:#fff;font-weight:400;line-height:1;
  text-shadow:0 0 20px rgba(242,199,110,.6),0 0 40px rgba(242,199,110,.3),
    0 2px 10px rgba(0,0,0,.8);
  letter-spacing:.05em;
  transition:all .3s ease;}
.clabel{font-family:'Space Mono',monospace;font-size:clamp(.65rem,1.4vw,.85rem);
  letter-spacing:.25em;text-transform:uppercase;color:var(--gold);
  font-weight:700;text-shadow:0 0 10px rgba(242,199,110,.5);}

/* Destaque especial para segundos */
.cfield:last-child{border-color:rgba(255,125,156,.5);
  box-shadow:0 4px 20px rgba(255,125,156,.3),0 0 30px rgba(255,125,156,.15);}
.cfield:last-child:hover{box-shadow:0 6px 30px rgba(255,125,156,.4),0 0 40px rgba(255,125,156,.25);}
.cfield:last-child .cnum{color:#ffd9e6;
  text-shadow:0 0 20px rgba(255,125,156,.7),0 0 40px rgba(255,125,156,.4),
    0 2px 10px rgba(0,0,0,.8);
  animation:secondPulse 1s ease-in-out infinite;}
.cfield:last-child .clabel{color:var(--rose);text-shadow:0 0 10px rgba(255,125,156,.6);}
@keyframes secondPulse{0%,100%{opacity:.85}50%{opacity:1}}

#counterNote{margin-top:40px;font-family:'Italiana',serif;font-size:clamp(1rem,2.8vw,1.35rem);
  color:var(--ink);letter-spacing:.08em;font-weight:400;
  text-shadow:0 0 15px rgba(243,236,221,.4);
  background:rgba(10,15,30,.5);backdrop-filter:blur(8px);
  padding:12px 24px;border-radius:8px;
  border:1px solid rgba(243,236,221,.2);}
#btnSkip{pointer-events:auto;margin-top:36px;background:none;border:none;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.4em;
  color:var(--ink-dim);opacity:.55;text-transform:uppercase;transition:.3s;}
#btnSkip:hover{opacity:1;color:var(--gold)}

#l-mem{justify-content:flex-end;padding-bottom:0}
#memCard{pointer-events:none;width:min(86vw,390px);margin-bottom:max(5vh,34px);
  background:#0c0f1e;border:1px solid rgba(242,199,110,.35);padding:12px 12px 0;
  box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 40px rgba(242,199,110,.12);
  opacity:0;transform:translateY(26px) rotate(-1.4deg);
  transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1);}
#memCard.on{opacity:1;transform:rotate(-1.4deg)}
#memCard .ph{overflow:hidden;aspect-ratio:4/4.6;position:relative;background:#000}
#memCard img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.9) contrast(1.05) brightness(.95);}
#memCard img.kb{animation:kenburns 7.5s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.18) translate(-1.6%,-2%)}}
#memCard .ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,8,18,.05),rgba(6,8,18,.35));}
#memCard figcaption{font-family:'Italiana',serif;font-size:clamp(1rem,3.4vw,1.25rem);
  letter-spacing:.05em;color:var(--ink);padding:16px 8px 18px;line-height:1.5;}
#memProg{display:flex;gap:10px;margin:0 0 22px}
#memProg i{width:5px;height:5px;border-radius:50%;background:rgba(243,236,221,.22);transition:.6s}
#memProg i.on{background:var(--gold);box-shadow:0 0 10px rgba(242,199,110,.8)}
@media(min-width:900px){
  #l-mem{align-items:flex-end;justify-content:center;padding-right:6vw;padding-bottom:0}
  #memCard{margin-bottom:11vh}
}

#l-future .line{transition:opacity 1.2s}
#futQ{font-size:clamp(1.5rem,5vw,2.9rem);color:var(--ink);
  text-shadow:0 0 30px rgba(127,224,242,.25)}
#futQ em{color:var(--cyan)}

#fadeBlack{position:fixed;inset:0;z-index:8;background:#010104;opacity:0;
  pointer-events:none;transition:opacity 1.6s ease;}
#fadeBlack.on{opacity:1}
#l-cine{z-index:9}
#l-cine .line{opacity:0;transform:translateY(10px);
  transition:opacity 1.15s ease,transform 1.15s ease;}
#l-cine .line.show{opacity:1;transform:none}

#l-final{z-index:10;justify-content:center;gap:20px;
  background:radial-gradient(70% 60% at 50% 50%,rgba(2,3,9,.6) 20%,rgba(2,3,9,.85) 100%);}
#proposal{font-size:clamp(2.5rem,9.4vw,6.2rem);letter-spacing:.03em;line-height:1.12;
  opacity:0;transform:scale(.9);
  transition:opacity 1.6s ease,transform 1.9s cubic-bezier(.16,.8,.24,1);
  color:#1a0a1a;
  background:rgba(243,236,221,.95);
  backdrop-filter:blur(12px);
  padding:30px 50px;border-radius:20px;
  border:2px solid rgba(242,199,110,.6);
  box-shadow:0 0 60px rgba(242,199,110,.4),0 10px 40px rgba(0,0,0,.6),
    inset 0 0 30px rgba(242,199,110,.1);
  text-shadow:0 2px 4px rgba(0,0,0,.2);}
#proposal.on{opacity:1;transform:none;animation:proposalGlow 3.4s ease-in-out 2s infinite}
#proposal span{color:#8b4513;font-weight:500}
@keyframes proposalGlow{0%,100%{box-shadow:0 0 60px rgba(242,199,110,.4),0 10px 40px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 80px rgba(242,199,110,.6),0 10px 50px rgba(255,125,156,.4)}}
#l-final .btnwrap{margin-top:44px;
  background:rgba(5,6,15,.6);backdrop-filter:blur(6px);
  padding:20px 30px;border-radius:16px;
  border:1px solid rgba(242,199,110,.2);
  box-shadow:0 0 30px rgba(0,0,0,.5);}
#epilogue{margin-top:44px;opacity:0;transition:opacity 2s ease;
  font-family:'Italiana',serif;font-size:clamp(1.1rem,3.4vw,1.6rem);
  letter-spacing:.1em;color:#fff;
  background:rgba(5,6,15,.75);backdrop-filter:blur(8px);
  padding:24px 32px;border-radius:12px;
  border:1px solid rgba(242,199,110,.25);
  box-shadow:0 0 30px rgba(0,0,0,.6),0 0 60px rgba(242,199,110,.15);
  text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 20px rgba(242,199,110,.4);
  max-width:90vw;}
#epilogue.on{opacity:1}
#epilogue small{display:block;margin-top:14px;font-family:'Space Mono',monospace;
  font-size:.62rem;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;
  text-shadow:0 0 10px rgba(242,199,110,.6)}

#soundBtn{position:fixed;right:18px;bottom:16px;z-index:20;width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(242,199,110,.4);
  background:rgba(8,10,22,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.6s;pointer-events:none}
#soundBtn.on{opacity:1;pointer-events:auto}
#soundBtn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6}
#soundBtn .w1,#soundBtn .w2{transition:.3s}
#soundBtn.muted .w1,#soundBtn.muted .w2{opacity:.15}
#eq{display:flex;gap:2px;align-items:flex-end;height:12px;margin-right:2px}
#eq b{width:2px;background:var(--gold);animation:eq .9s ease-in-out infinite}
#eq b:nth-child(2){animation-delay:.25s}#eq b:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
#soundBtn.muted #eq b{animation:none;height:3px;opacity:.3}

#ytWrap{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;
  pointer-events:none;overflow:hidden;z-index:-10}
</style>
</head>
<body>

<canvas id="space"></canvas>
<div id="vignette"></div>
<div id="darkveil"></div>
<div id="spark"></div>
<div id="fadeBlack"></div>

<!-- 1 · ABERTURA  —  já vem com classe "on" para ser visível -->
<section class="layer on" id="l-intro">
  <div class="halo"></div><div class="halo h2"></div>
  <p class="eyebrow">uma história escrita nas estrelas</p>
  <h1 id="introTitle">O Nosso <span>Universo</span></h1>
  <button class="btn" id="btnStart">Iniciar nossa jornada</button>
  <p id="soundHint">♪ &nbsp;ligue o som — essa é a nossa música&nbsp; ♪</p>
</section>

<section class="layer" id="l-counter">
  <p id="counterIntro">desde 12 de outubro de 2025, às 16:30</p>
  <div id="counter"></div>
  <p id="counterNote">…e cada segundo continua contando, em tempo real ✦</p>
  <button id="btnSkip">pular ✦</button>
</section>

<section class="layer" id="l-cine">
  <p class="line" id="cineLine"></p>
  <div class="btnwrap" id="cineBtns"><button class="btn" id="btnYes1">Sim ❤️</button></div>
</section>

<section class="layer" id="l-mem">
  <figure id="memCard">
    <div class="ph"><img id="memImg" alt="memória"></div>
    <figcaption id="memCap"></figcaption>
  </figure>
  <div id="memProg"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</section>

<section class="layer" id="l-future">
  <p class="line" id="futQ"></p>
  <div class="btnwrap" id="futBtns"><button class="btn" id="btnYes2">Sim ❤️</button></div>
</section>

<section class="layer" id="l-final">
  <h1 id="proposal">Quer casar <span>comigo?</span></h1>
  <div class="btnwrap" id="finalBtns">
    <button class="btn" id="btnYesA">Sim ❤️</button>
    <button class="btn" id="btnYesB">Sim, para sempre ❤️</button>
  </div>
  <p id="epilogue">Para sempre, então. ✦<small>12 · 10 · 2025 — o começo de tudo</small></p>
</section>

<button id="soundBtn" aria-label="som">
  <span id="eq"><b></b><b></b><b></b></span>
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="var(--gold)" stroke="none"/>
  <path class="w1" d="M16 9c1.4 1.4 1.4 4.6 0 6"/><path class="w2" d="M18.5 6.5c2.8 2.8 2.8 8.2 0 11"/></svg>
</button>

<div id="ytWrap"><div id="ytFrame"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
const $  = id => document.getElementById(id);
const V3 = (x,y,z)=> new THREE.Vector3(x,y,z);
const wait = ms => new Promise(r=>setTimeout(r,ms));
const easeIO  = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut = t=> 1-Math.pow(1-t,3);
const easeIn  = t=> t*t*t;

const tweens=[];
function addTween(dur,ease,onU,onC){ tweens.push({t0:performance.now(),dur,ease,onU,onC}); }
function tw(dur,ease,onU){ return new Promise(r=>addTween(dur,ease,onU,r)); }
function stepTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const T=tweens[i]; let p=(now-T.t0)/T.dur;
    if(p>=1){ T.onU(1); tweens.splice(i,1); T.onC&&T.onC(); }
    else T.onU(T.ease(Math.max(0,p)));
  }
}

function glowTexture(inner,outer){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,inner);gr.addColorStop(.35,outer);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const texStar = glowTexture('rgba(255,255,255,1)','rgba(255,255,255,.35)');
const texGlow = glowTexture('rgba(255,244,214,.95)','rgba(242,199,110,.4)');

/* CENA */
const renderer=new THREE.WebGLRenderer({canvas:$('space'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
camera.position.set(0,1.6,30);
const curLook=V3(0,0,0);

function starLayer(n,color,size,op){
  const g=new THREE.BufferGeometry(),a=new Float32Array(n*3);
  for(let i=0;i<n;i++){a[i*3]=(Math.random()-.5)*560;a[i*3+1]=(Math.random()-.5)*360;a[i*3+2]=-560+Math.random()*660;}
  g.setAttribute('position',new THREE.BufferAttribute(a,3));
  const m=new THREE.PointsMaterial({size,map:texStar,color,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const p=new THREE.Points(g,m);scene.add(p);return p;
}
const starsA=starLayer(1500,0xcfe0ff,1.7,.85);
const starsB=starLayer(900,0xffe2c4,1.3,.7);

function nebulaSet(colors,op){
  const arr=[];const pos=[[-70,26,-90],[80,-34,-170],[-50,-46,-270],[40,36,-370],[0,6,-140]];
  pos.forEach((p,i)=>{
    const s=new THREE.Sprite(new THREE.SpriteMaterial({
      map:glowTexture(colors[i%3]+'cc',colors[i%3]+'44'),
      transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.position.set(...p);s.scale.setScalar(240+Math.random()*140);scene.add(s);arr.push(s);
  });return arr;
}
const nebCool=nebulaSet(['#27497a','#5b2b6e','#1e5a66'],.3);
const nebWarm=nebulaSet(['#8a6a22','#2b6e6a','#7a4a1e'],0);

const HN=2600;
const hGeo=new THREE.BufferGeometry();
{
  const pos=new Float32Array(HN*3),dir=new Float32Array(HN*3),
        sz=new Float32Array(HN),ph=new Float32Array(HN);
  let i=0;
  while(i<HN){
    const x=Math.random()*2.5-1.25, y=Math.random()*2.9-1.35;
    const f=Math.pow(x*x+y*y-1,3)-x*x*y*y*y;
    if(f<0){
      const th=.35+Math.min(1.5,-f*2.2);
      pos[i*3]=x*6.6; pos[i*3+1]=y*6.6+1.1; pos[i*3+2]=(Math.random()*2-1)*th*2.3;
      let dx=Math.random()*2-1,dy=Math.random()*2-1,dz=Math.random()*2-1;
      const L=Math.hypot(dx,dy,dz)||1;
      dir[i*3]=dx/L;dir[i*3+1]=dy/L;dir[i*3+2]=dz/L;
      sz[i]=.5+Math.random()*.95; ph[i]=Math.random(); i++;
    }
  }
  hGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  hGeo.setAttribute('aDir',new THREE.BufferAttribute(dir,3));
  hGeo.setAttribute('aSize',new THREE.BufferAttribute(sz,1));

    uColA:{value:new THREE.Color('#ff5f86')},
    uColB:{value:new THREE.Color('#ffd98f')},
  },
  vertexShader:`
    attribute float aSize; attribute float aPhase; attribute vec3 aDir;
    uniform float uTime,uSpread,uSize,uOpacity;
    varying float vA; varying float vM;
    void main(){
      vec3 p=position+aDir*uSpread;
      vM=fract(aPhase*7.13);
      float twk=.55+.45*sin(uTime*1.7+aPhase*6.2831);
      vA=twk*uOpacity;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=min(aSize*uSize*twk*(190./-mv.z),60.);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform vec3 uColA,uColB; varying float vA; varying float vM;
    void main(){
      float d=length(gl_PointCoord-.5);
      float a=smoothstep(.5,.05,d)*vA;
      gl_FragColor=vec4(mix(uColA,uColB,vM),a);
    }`

function setNum(id,val){

function tickCounter(){
  const now=new Date();
  const a=now<TARGET?now:TARGET,b=now<TARGET?TARGET:now;
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  const rem=Math.abs(now-TARGET)%86400000;
  setNum('cfY',y);setNum('cfM',m);setNum('cfD',d);
  setNum('cfH',Math.floor(rem/3600000));setNum('cfMI',Math.floor(rem/60000)%60);setNum('cfS',Math.floor(rem/1000)%60);
}

function stepWarp(dt){
  if(!warp.on&&warp.spd<=0)return;
  const p=wGeo.attributes.position.array,cz=camera.position.z;
  for(let i=0;i<WN;i++){
    let z=p[i*6+2]+warp.spd*dt;
    if(z>cz+6){z=cz-280-Math.random()*120;
      p[i*6]=(Math.random()-.5)*90;p[i*6+1]=(Math.random()-.5)*60;p[i*6+3]=p[i*6];p[i*6+4]=p[i*6+1];}
    p[i*6+2]=z;p[i*6+5]=z-4-Math.min(14,warp.spd*.09);
  }
  wGeo.attributes.position.needsUpdate=true;
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const t=now/1000;
  stepTweens(now);
  timeScale+=(tsTarget-timeScale)*.02;

  heartMat.uniforms.uTime.value=t*timeScale;
  heartMat.uniforms.uColA.value.lerp(palA,.03);
  heartMat.uniforms.uColB.value.lerp(palB,.03);
  heartGroup.rotation.y+=.0016*timeScale*60*dt;

  if(heartMat.uniforms.uOpacity.value>.02){
    const p=(t*1.05)%1.2;
    const k=x=>Math.max(0,1-Math.abs(p-x)*7);
    const s=1+(heartbeat?.055:.02)*(k(0)+k(.22)*.6);
    heartGroup.scale.setScalar(s);
  }
  phraseSprites.forEach(s=>{const u=s.userData;u.ang+=u.spd*dt*timeScale;
    s.position.set(Math.cos(u.ang)*u.r,u.y+Math.sin(t*.6+u.r)*.4,Math.sin(u.ang)*u.r);});

  starsA.material.opacity=.6+.3*Math.sin(t*1.3);
  starsB.material.opacity=.6+.3*Math.sin(t*1.3+Math.PI);
  starsA.rotation.z+=.00006;starsB.rotation.z-=.00005;
  nebCool.forEach(s=>s.material.opacity+=(nebCoolTarget-s.material.opacity)*.02);
  nebWarm.forEach(s=>s.material.opacity+=(nebWarmTarget-s.material.opacity)*.02);
  memStars.forEach((s,i)=>{const b=3+ .5*Math.sin(t*2.4+i*1.7);s.scale.setScalar(b);});
  futureGroup.forEach(g=>g.rotation.z+=.0004);
  stepWarp(dt);

  const swx=Math.sin(t*.22)*.35+pointer.x*1.1, swy=Math.cos(t*.17)*.25-pointer.y*.8;
  camera.position.x+=Math.sin(t*.5)*.002;camera.position.y+=Math.cos(t*.42)*.002;
  camera.lookAt(curLook.x+swx,curLook.y+swy,curLook.z);
  camera.rotation.z=Math.sin(t*.11)*.008;
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
